name: Construire l'APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Préparer le projet Android
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6
          npx cap init "Entretien Peugeot 106" com.peugeot106.entretien --web-dir www
          npx cap add android
          npx cap sync android

      - name: Installer l'icône de l'application
        run: |
          python3 -m pip install pillow
          python3 - <<'PY'
          import os
          import shutil
          from PIL import Image

          src = Image.open("icon.png").convert("RGBA")
          res = "android/app/src/main/res"
          shutil.rmtree(res + "/mipmap-anydpi-v26", ignore_errors=True)
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for density, px in sizes.items():
              folder = res + "/mipmap-" + density
              os.makedirs(folder, exist_ok=True)
              img = src.resize((px, px), Image.LANCZOS)
              img.save(folder + "/ic_launcher.png")
              img.save(folder + "/ic_launcher_round.png")
          PY

      - name: Autoriser les notifications
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: entretien-peugeot-106-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
